<!DOCTYPE html>
<html lang="en">
	<head>
    	<meta charset="utf-8">
    	<meta name="description" content="This is where your description goes">
    	<meta name="keywords" content="one, two, three">

		<title>Title in the tab</title>

		<!-- external CSS link -->
		<link rel="stylesheet" href="css/normalize.css">
		<link rel="stylesheet" href="css/style.css">
	</head>
	<body>
		<div class="container">

			<h1>Moon Phases in the World</h1>
			<p class="instructions">Type in a place in the world (ex: country, region, etc)</p>

			<div class="search">
				<input type="text" name="" value="" placeholder="Try Tokyo or Iceland">
				<button type="button" name="button">Get Moon Phase</button>
			</div>

			<div class="results">
				<h2>Place</h2>
				<h3>Astro Features</h3>
				<h4>Sunrise: <span class="sunrise"></span></h4>
				<h4>Sunset: <span class="sunset"></span></h4>
				<h4>Moonrise: <span class="moonrise"></span></h4>
				<h4>Moonset: <span class="moonset"></span></h4>
				<h4>Moon Phase: <span class="moon-phase"></span></h4>
				<h4>Moon Illumination: <span class="moon-ill"></span></h4>
			</div>

			<img src="img/moon-phases.webp" alt="Chart of the moon phases">

		</div>

		<script type="text/javascript" src="js/main.js"></script>
	</body>
</html>
